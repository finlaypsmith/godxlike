name: Godlike 续期
on:
  # schedule:
  #   - cron: '35 */1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write

jobs:
  add_time_job:
    name: 运行续期脚本
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests playwright pynacl websockets
          playwright install --with-deps chromium

      - name: ⚙ 设置代理 (自动选择 sing-box / Xray)
        continue-on-error: false
        env:
          NODE_LINK: ${{ secrets.PROXY_NODE }}
        run: |
          bash <(wget -qO- https://gist.githubusercontent.com/janver/c5dcc485bb25a43568cb33ac3cb49efd/raw/setup_p.sh)

      - name: 运行续期脚本
        env:
          GODLIKE_1: ${{ secrets.GODLIKE_1 }}
          GODLIKE_2: ${{ secrets.GODLIKE_2 }}   
          GODLIKE_3: ${{ secrets.GODLIKE_3 }}
          GODLIKE_4: ${{ secrets.GODLIKE_4 }}
          GODLIKE_5: ${{ secrets.GODLIKE_5 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: python main.py

#      - name: 上传截图
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: error-screenshots
#          path: Godlike/*.png

      - name: Cleanup proxy
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f 'xray run' || true
          rm -f sing-box sing-box-config.json sing-box.log
          rm -f xray xray-config.json xray.log

      - name: 清理历史
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
